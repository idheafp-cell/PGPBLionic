<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tambah Mata Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
  <ion-card-content>
    <ion-list>
  <ion-item>
    <ion-input label="Mata Kuliah" placeholder="isikan nama mata kuliah"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Waktu" placeholder="isikan waktu mata kuliah"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Dosen" placeholder="isikan nama dosen"></ion-input>
  </ion-item>
</ion-list>

<ion-button color="primary">Simpan</ion-button>
  </ion-card-content>
</ion-card>
</ion-content>
