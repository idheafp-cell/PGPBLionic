<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Jadwal Kuliah </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-accordion-group>
    <ion-accordion value="first">
      <ion-item slot="header" color="light">
        <ion-label>Senin</ion-label>
      </ion-item>

      <div class="ion-padding" slot="content">
        <ion-card>
        <ion-grid>
          <ion-row>
            <ion-col>Pendidikan Kewarganegaraan</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>08:00 - 10:00</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>Aula</ion-col>
          </ion-row>
        </ion-grid>
        </ion-card>
      </div>
    </ion-accordion>
    <ion-accordion value="second">
      <ion-item slot="header" color="light">
        <ion-label>Selasa</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-card>
        <ion-grid>
          <ion-row>
            <ion-col>Pemrograman Geospasial</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>10:00 - 12:00</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>Laboratorium</ion-col>
          </ion-row>
        </ion-grid>
        </ion-card>
      </div>
    </ion-accordion>
    <ion-accordion value="third">
      <ion-item slot="header" color="light">
        <ion-label>Rabu</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-card>
        <ion-grid>
          <ion-row>
            <ion-col>Matematika</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>14:00 - 16:00</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>Ruang Kelas 3</ion-col>
          </ion-row>
        </ion-grid>
        </ion-card>
      </div>
    </ion-accordion>
    <ion-accordion value="fourth">
      <ion-item slot="header" color="light">
        <ion-label>Kamis</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-card>
        <ion-grid>
          <ion-row>
            <ion-col>Metodologi Penelitian</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>08:00 - 10:00</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>Ruang Kelas 2</ion-col>
          </ion-row>
        </ion-grid>
        </ion-card>
      </div>
    </ion-accordion>
    <ion-accordion value="fifth">
      <ion-item slot="header" color="light">
        <ion-label>Jumat</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-card>
        <ion-grid>
          <ion-row>
            <ion-col>Agama</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>10:00 - 12:00</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>Ruang Kelas 1</ion-col>
          </ion-row>
        </ion-grid>
        </ion-card>
      </div>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>
